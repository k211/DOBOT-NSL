<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Labelled diagram of a PS5 DualSense controller showing L1 as the deadman, L2 and R2 unused, R1 as turbo, the D-pad for horizontal translation, the left stick for up and down, the right stick for yaw, the square and circle buttons for pitch, the triangle and cross buttons for roll, and the PS button as unusable.">
<style>
  svg { color: #24343A; }
  @media (prefers-color-scheme: dark) { svg { color: #D6E2E6; } }
</style>

        <g fill="none" stroke="currentColor" stroke-linecap="round">
          <!-- shoulders -->
          <rect x="268" y="34" width="86" height="21" rx="10" stroke-width="1.6"/>
          <rect x="566" y="34" width="86" height="21" rx="10" stroke-width="1.6"/>
          <rect x="274" y="60" width="74" height="20" rx="9" stroke-width="1.6"/>
          <rect x="572" y="60" width="74" height="20" rx="9" stroke-width="1.6"/>
          <!-- grips -->
          <rect x="296" y="248" width="88" height="176" rx="44" stroke-width="1.8" transform="rotate(-14 340 310)"/>
          <rect x="536" y="248" width="88" height="176" rx="44" stroke-width="1.8" transform="rotate(14 580 310)"/>
          <!-- body -->
          <rect x="240" y="80" width="440" height="196" rx="56" stroke-width="2.2" fill="none"/>
          <!-- touchpad -->
          <rect x="408" y="100" width="104" height="58" rx="8" stroke-width="1.4"/>
          <!-- dpad -->
          <path d="M310 128 h26 v-26 h26 v26 h26 v26 h-26 v26 h-26 v-26 h-26 z" stroke-width="1.8"/>
          <!-- shapes -->
          <circle cx="590" cy="114" r="13" stroke-width="1.6"/>
          <circle cx="616" cy="141" r="13" stroke-width="1.6"/>
          <circle cx="590" cy="168" r="13" stroke-width="1.6"/>
          <circle cx="564" cy="141" r="13" stroke-width="1.6"/>
          <!-- sticks -->
          <circle cx="382" cy="222" r="32" stroke-width="1.8"/>
          <circle cx="382" cy="222" r="19" stroke-width="1.2"/>
          <circle cx="538" cy="222" r="32" stroke-width="1.8"/>
          <circle cx="538" cy="222" r="19" stroke-width="1.2"/>
          <!-- ps -->
          <circle cx="460" cy="214" r="12" stroke-width="1.5"/>
        </g>
        <!-- shape glyphs -->
        <g font-family="ui-monospace,Menlo,monospace" font-size="13" fill="currentColor" text-anchor="middle">
          <text x="590" y="119">△</text>
          <text x="616" y="146">○</text>
          <text x="590" y="173">✕</text>
          <text x="564" y="146">□</text>
          <text x="460" y="219" font-size="10">PS</text>
        </g>
        <!-- callout lines -->
        <g stroke="currentColor" stroke-width="1.1" opacity=".55">
          <line x1="268" y1="44" x2="150" y2="44"/>
          <line x1="274" y1="70" x2="150" y2="96"/>
          <line x1="310" y1="141" x2="150" y2="168"/>
          <line x1="350" y1="222" x2="150" y2="258"/>
          <line x1="652" y1="44" x2="784" y2="44"/>
          <line x1="646" y1="70" x2="784" y2="96"/>
          <line x1="629" y1="141" x2="784" y2="168"/>
          <line x1="570" y1="222" x2="784" y2="258"/>
          <line x1="460" y1="226" x2="500" y2="330"/>
        </g>
        <!-- left labels -->
        <g font-family="ui-monospace,Menlo,monospace" font-size="12.5" text-anchor="end">
          <text x="146" y="40" fill="#D6301F" font-weight="700">L2  unused</text>
          <text x="146" y="92" fill="currentColor" font-weight="700">L1  DEADMAN</text>
          <text x="146" y="108" fill="currentColor" font-size="11" opacity=".75">hold to move</text>
          <text x="146" y="164" fill="currentColor" font-weight="700">D-PAD</text>
          <text x="146" y="180" fill="currentColor" font-size="11" opacity=".75">move left/right</text>
          <text x="146" y="195" fill="currentColor" font-size="11" opacity=".75">move near/far</text>
          <text x="146" y="254" fill="currentColor" font-weight="700">LEFT STICK</text>
          <text x="146" y="270" fill="currentColor" font-size="11" opacity=".75">up / down</text>
        </g>
        <!-- right labels -->
        <g font-family="ui-monospace,Menlo,monospace" font-size="12.5">
          <text x="788" y="40" fill="#D6301F" font-weight="700">R2  unused</text>
          <text x="788" y="92" fill="currentColor" font-weight="700">R1  turbo x1.5</text>
          <text x="788" y="164" fill="currentColor" font-weight="700">SHAPES</text>
          <text x="788" y="180" fill="currentColor" font-size="11" opacity=".75">[] / O  pitch</text>
          <text x="788" y="195" fill="currentColor" font-size="11" opacity=".75">/\ / X  roll</text>
          <text x="788" y="254" fill="currentColor" font-weight="700">RIGHT STICK</text>
          <text x="788" y="270" fill="currentColor" font-size="11" opacity=".75">yaw (faster)</text>
        </g>
        <text x="504" y="346" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#D6301F">PS button does nothing — Linux never sees it</text>
        <!-- homing combo -->
        <rect x="240" y="400" width="440" height="72" rx="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="5 4"/>
        <text x="460" y="428" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="13" font-weight="700" fill="currentColor">HOMING:  hold  L1 + L2 + R2  for 1 second</text>
        <text x="460" y="452" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor" opacity=".75">arm returns to the safe pose, then you must release L1 to drive again</text>
      </svg>
