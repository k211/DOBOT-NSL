<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-label="Connection diagram: wall power and the emergency stop switch connect to the robot base; the robot's LAN1 port connects by Ethernet to the laptop; the PS5 controller connects by USB to the laptop, never to the robot.">
<style>
  svg { color: #24343A; }
  @media (prefers-color-scheme: dark) { svg { color: #D6E2E6; } }
</style>

        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
          </marker>
          <marker id="arx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#D6301F"/>
          </marker>
        </defs>
        <!-- wall -->
        <rect x="24" y="40" width="130" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="89" y="66" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="currentColor">WALL</text>
        <text x="89" y="84" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="currentColor">100-240V</text>
        <!-- estop -->
        <rect x="24" y="150" width="130" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="52" cy="181" r="12" fill="#D6301F"/>
        <text x="100" y="178" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="currentColor">E-STOP</text>
        <text x="100" y="195" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">switch</text>
        <!-- robot -->
        <rect x="290" y="78" width="180" height="150" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <text x="380" y="122" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="currentColor">ROBOT BASE</text>
        <text x="380" y="144" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">Magician E6</text>
        <text x="380" y="176" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">LAN1 192.168.5.1</text>
        <text x="380" y="198" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">controller inside</text>
        <!-- laptop -->
        <rect x="620" y="78" width="180" height="150" rx="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
        <text x="710" y="126" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="600" fill="currentColor">LAPTOP</text>
        <text x="710" y="150" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">Ubuntu 22.04</text>
        <text x="710" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">enp59s0</text>
        <text x="710" y="194" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">192.168.5.10</text>
        <!-- pad -->
        <rect x="620" y="286" width="180" height="62" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="710" y="312" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12.5" fill="currentColor">PS5 DUALSENSE</text>
        <text x="710" y="330" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">USB-C cable</text>
        <!-- links -->
        <line x1="154" y1="71" x2="286" y2="105" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
        <text x="196" y="80" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">power</text>
        <line x1="154" y1="181" x2="286" y2="200" stroke="currentColor" stroke-width="1.5" marker-end="url(#ar)"/>
        <text x="186" y="203" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">e-stop port</text>
        <line x1="470" y1="153" x2="616" y2="153" stroke="currentColor" stroke-width="2.5" marker-end="url(#ar)" marker-start="url(#ar)"/>
        <text x="543" y="143" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="currentColor">Ethernet</text>
        <text x="543" y="172" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">LAN1 → laptop</text>
        <line x1="710" y1="282" x2="710" y2="232" stroke="currentColor" stroke-width="2" marker-end="url(#ar)"/>
        <text x="722" y="262" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="currentColor">USB</text>
        <!-- forbidden -->
        <line x1="616" y1="317" x2="476" y2="250" stroke="#D6301F" stroke-width="1.8" stroke-dasharray="7 5"/>
        <line x1="534" y1="268" x2="562" y2="300" stroke="#D6301F" stroke-width="2.4"/>
        <line x1="562" y1="268" x2="534" y2="300" stroke="#D6301F" stroke-width="2.4"/>
        <text x="470" y="300" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#D6301F">never into the robot</text>
        <text x="470" y="318" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#D6301F">base USB port</text>
      </svg>
