# Controllers for the ME6 under gz_ros2_control (Gazebo Harmonic).
# Controller name kept as "joint_trajectory_controller" so MoveIt Servo's
# command_out_topic and home_arm.py match the Kinova reference unchanged.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
