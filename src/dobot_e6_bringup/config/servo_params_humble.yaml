servo_node:
  ros__parameters:
    use_sim_time: true

    # MoveIt Servo 2.5.x (ROS 2 Humble) parameter schema. Keep this separate
    # from servo_params.yaml because Jazzy uses a newer parameter schema.
    moveit_servo:
      use_gazebo: true

      move_group_name: "manipulator"
      planning_frame: "base_link"
      ee_frame_name: "Link6"
      robot_link_command_frame: "base_link"

      # joy_to_servo.py publishes real m/s and rad/s values.
      command_in_type: "speed_units"
      scale:
        linear: 0.1
        rotational: 0.1
        joint: 0.5

      cartesian_command_in_topic: ~/delta_twist_cmds
      joint_command_in_topic: ~/delta_joint_cmds
      command_out_topic: /joint_trajectory_controller/joint_trajectory
      command_out_type: "trajectory_msgs/JointTrajectory"
      joint_topic: /joint_states
      status_topic: ~/status

      publish_period: 0.02
      low_latency_mode: false
      incoming_command_timeout: 0.2
      num_outgoing_halt_msgs_to_publish: 4

      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false
      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

      joint_limit_margin: 0.1
      lower_singularity_threshold: 60.0
      hard_stop_singularity_threshold: 100.0
      leaving_singularity_threshold_multiplier: 2.0

      check_collisions: false
      is_primary_planning_scene_monitor: true
