servo_node:
  ros__parameters:
    robot_description_kinematics:
      manipulator:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.005
    # Inline SRDF for the ME6 + probe wrapper. Group name "manipulator" matches
    # servo_params.yaml; robot name must match the URDF ("me6_robot").
    # Collision pairs are the vendor SRDF's plus the appended probe link.
    robot_description_semantic: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>
      <robot name=\"me6_robot\">
        <group name=\"manipulator\">
          <chain base_link=\"base_link\" tip_link=\"probe_tcp\"/>
        </group>
        <group_state name=\"home\" group=\"manipulator\">
          <joint name=\"joint1\" value=\"0\"/>
          <joint name=\"joint2\" value=\"0.5337\"/>
          <joint name=\"joint3\" value=\"0.7276\"/>
          <joint name=\"joint4\" value=\"0.3548\"/>
          <joint name=\"joint5\" value=\"-1.5848\"/>
          <joint name=\"joint6\" value=\"0\"/>
        </group_state>
        <disable_collisions link1=\"Link1\" link2=\"Link2\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link1\" link2=\"Link4\" reason=\"Never\"/>
        <disable_collisions link1=\"Link1\" link2=\"base_link\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link2\" link2=\"Link3\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link3\" link2=\"Link4\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link4\" link2=\"Link5\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link4\" link2=\"Link6\" reason=\"Never\"/>
        <disable_collisions link1=\"Link5\" link2=\"Link6\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link6\" link2=\"us_probe_link\" reason=\"Adjacent\"/>
        <disable_collisions link1=\"Link5\" link2=\"us_probe_link\" reason=\"Never\"/>
        <disable_collisions link1=\"Link4\" link2=\"us_probe_link\" reason=\"Never\"/>
      </robot>"
